# DeltaDrift reference configuration. Every key is optional; omitted keys use
# the compiled defaults (`deltadrift config` prints them). Unknown keys are errors.

[engine]
mode = "paper"            # "paper" | "live" (live refused until Sprint 4)
# cores = [0, 1, 2, 3]    # [control/cold, feed, strategy, risk+router]; omit = auto (one per physical core, fastest first)
pin = true
wait = "spin"             # "spin" on isolated prod cores, "yield" on shared machines
rate_per_sec = 200000     # demo feed rate; 0 = unthrottled
duration_secs = 10.0

[feed]                    # synthetic demo feed (--demo)
instruments = 8
seed = 908_342_211_063
calm_vol = 1e-4
stress_mult = 4.0
regime_switch_p = 1e-5
mean_reversion = 0.02
spread_bps = 1.0

[strategy]                # ZScoreReversion baseline
vol_halflife_ticks = 500.0
surprise_halflife_ms = 50
entry_z = 2.5
exit_z = 0.5
beta = 0.05
horizon_ticks = 50.0
warmup_ticks = 1000

[risk]                    # hard guardrails — enforced outside the strategy
starting_equity = 100000.0
max_daily_drawdown = 0.02
stop_loss = 0.01
stop_cooldown_ms = 5000
kelly_fraction = 0.25
max_position_notional = 10000.0
max_gross_notional = 50000.0
min_order_notional = 50.0
max_orders_per_sec = 50
order_burst = 10
limit_slippage_bps = 5.0

[paper]
fee_bps = 1.0
slippage_bps = 0.5

[live]                    # used with `--live` (venue/symbols/io can also be set on the CLI)
venue = "ctrader"         # ctrader (default, free demo) | binance | alpaca-crypto | alpaca-stocks
symbols = ["EURUSD", "GBPUSD", "USDJPY", "BTCUSD", "ETHUSD"]   # broker-specific names
io = "uring"              # std | uring | sqpoll

[backtest]
data_root = "data"            # cache for `deltadrift data fetch` (git-ignored)
symbols = ["EURUSD"]          # USD-quoted only until FX conversion (live blocker L15)
threads = 0                   # 0 = all cores
g1_min_years = 2.0            # gate G1 thresholds (docs/LIVE_READINESS.md)
g1_min_round_trips = 300
g1_min_dsr = 0.95
g1_max_drawdown = 0.15
g1_min_win_rate = 0.70        # owner rule: live only above 70% wins (net of costs)
g1_min_profit_factor = 1.3    # wins must outweigh losses: a 70% win rate alone can still lose money

[backtest.costs]              # conservative placeholders until replaced by broker values
latency_ms = 50
slippage_bps = 0.2
commission_per_million = 35.0 # e.g. 3.50 per 100k lot per side
swap_long_annual = 0.02       # financing cost on notional per year (negative = credit)
swap_short_annual = 0.02

[backtest.walk_forward]
train_days = 90
test_days = 30

[backtest.grid]               # Cartesian product for the baseline strategy
entry_z = [2.0, 3.0, 4.0]
exit_z = [0.0, 0.5]
vol_halflife_ticks = [200.0, 1000.0]
surprise_halflife_ms = [1000, 30000]
